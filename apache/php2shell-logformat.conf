# PHP2Shell detection (CVE-2026-109618/109619): key=value access log consumed by the
# Wazuh decoder php2shell-accesslog. Place inside the VirtualHost to monitor.
# The line has no square brackets on purpose, so the native web-accesslog decoder
# does not claim it first.
LogFormat "php2shell ip=%h ts=\"%{%Y-%m-%dT%H:%M:%S%z}t\" req=\"%r\" status=%>s bytes=%O ref=\"%{Referer}i\" ua=\"%{User-Agent}i\" ct=\"%{Content-Type}i\" te=\"%{Transfer-Encoding}i\" cl=\"%{Content-Length}i\" sc=\"%{Set-Cookie}o\"" php2shell
CustomLog ${APACHE_LOG_DIR}/php2shell_access.log php2shell
